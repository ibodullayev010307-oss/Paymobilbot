<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYMOBILE UC - To'lov</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <div class="logo">💎 PAYMOBILE UC</div>
        <div class="online">🟢 24/7</div>
    </header>

    <section class="hero">
        <h1>💳 TO‘LOV OYNASI</h1>
        <p>Buyurtmangiz uchun to‘lovni amalga oshiring.</p>
    </section>

    <h2>📦 Buyurtma ma'lumotlari</h2>

    <div class="package">
        <div class="uc" id="ucAmount"></div>
        <div class="price" id="ucPrice"></div>
    </div>

    <div class="package" style="margin-top:15px;">
        <h3>💳 UZCARD</h3>
        <p style="margin-top:15px;">Karta egasi:</p>
        <b>IBODULLAYEV HASANBOY</b>

        <p style="margin-top:15px;">Karta raqami:</p>

        <h3 id="cardNumber">5614 6816 0521 4463</h3>

        <button onclick="copyCard()" style="padding:12px;margin-top:15px;border:0;border-radius:10px;background:#087bd8;color:white;">
            📋 KARTA RAQAMINI NUSXALASH
        </button>
    </div>

    <h2 style="margin-top:25px;">🧾 TO‘LOV CHEKI</h2>

    <p style="color:#a9c5df;font-size:13px;margin-bottom:15px;">
        Kartaga pul o'tkazganingizdan so‘ng chek rasmini tanlang.
    </p>

    <input
        type="file"
        id="receipt"
        accept="image/*"
        style="width:100%;padding:15px;background:#10243a;color:white;border-radius:12px;"
    >

    <div id="preview" style="margin-top:15px;"></div>

    <button id="sendBtn" style="width:100%;padding:17px;margin-top:25px;border:0;border-radius:14px;background:linear-gradient(90deg,#087bd8,#31baff);color:white;font-weight:bold;font-size:16px;">
        ✅ BUYURTMANI YUBORISH
    </button>

    <p id="message" style="margin-top:15px;text-align:center;"></p>

</div>

<script>
const selectedPackage = JSON.parse(
    localStorage.getItem("selectedPackage")
);

if (!selectedPackage || !localStorage.getItem("pubgId")) {
    window.location.href = "index.html";
}

document.getElementById("ucAmount").textContent =
    "💎 " + selectedPackage.uc.toLocaleString("uz-UZ") + " UC";

document.getElementById("ucPrice").textContent =
    selectedPackage.price.toLocaleString("uz-UZ") + " so'm";

function copyCard() {
    navigator.clipboard.writeText("5614681605214463")
        .then(() => alert("Karta raqami nusxalandi!"));
}

const receiptInput = document.getElementById("receipt");

receiptInput.addEventListener("change", function() {
    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Faqat rasm yuklang!");
        this.value = "";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert("Rasm hajmi 5 MB dan oshmasin!");
        this.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        document.getElementById("preview").innerHTML =
            `<img src="${e.target.result}"
            style="width:100%;border-radius:12px;">`;
    };

    reader.readAsDataURL(file);
});

document.getElementById("sendBtn").onclick = function() {
    const message = document.getElementById("message");

    if (!receiptInput.files.length) {
        message.textContent = "Avval to‘lov chekini yuklang!";
        message.style.color = "#ff5555";
        return;
    }

    message.textContent =
        "Chek tanlandi. Buyurtmani yuborish tizimini keyingi bosqichda ulaymiz.";

    message.style.color = "#50bdff";
};
</script>

</body>
  </html>
